id: camera_occlusion
description: >
  Camera occlusion: every frame of control tray A from 2016-01-06T09:00Z to 2016-01-06T21:00Z is replaced by a black
  image with a canopy mask of area 0 (written straight into the temp DB, no SAM call). The plants did not change.
  Control tray A is the reference of B, C and L, so a dead A camera can raise GROWTH_LAG on the trays compared with
  it. `alert_rule: auto` assesses whichever alert is open on tray A and, if there is none, the open GROWTH_LAG
  alert of a tray that uses A as its reference (a knock-on alert). The agent should rank camera_fault (or
  sensor_fault) above any plant cause. If no rule fires at all, the scenario records "no alert" and has no
  assessment (require_alert is false); the run report then says so.
data_source: simulated         # injected black frames, not a real or transformed dataset frame
tray_id: A
as_of: "2016-01-06T22:00:00Z"
window: {start: "2016-01-05T22:00:00Z", end: "2016-01-06T22:00:00Z"}
alert_rule: auto               # any alert that fires on tray A after the injection
injections:
  - {type: occlude_frames, tray_id: A, start: "2016-01-06T09:00:00Z", end: "2016-01-06T21:00:00Z"}
expected_top_cause: camera_fault
acceptable_causes: [camera_fault, sensor_fault]
expected_alerts: []
scoring: {require_alert: false}
