id: camera_occlusion
description: >
  Camera occlusion on a healthy tray: every frame of tray B from 2016-01-03T09:00Z to 2016-01-03T21:00Z (before B's
  simulated drought starts on 01-05) is replaced by a black image with a canopy mask of area 0 (written straight
  into the temp DB, no SAM call). The plants did not change. Per-pot growth tracking compares only pots that hold a
  plant at both ends of a window, so a blank frame must not read as plant loss: no plant-health alert should be
  raised on B. Scored as a robustness check (false alarm or not); nothing is assessed. An earlier version occluded
  control tray A on 01-06 and ended up assessing B's real, already-open drought alert, which tested nothing.
data_source: simulated         # injected black frames, not a real or transformed dataset frame
tray_id: B
as_of: "2016-01-03T22:00:00Z"
window: {start: "2016-01-03T00:00:00Z", end: "2016-01-03T22:00:00Z"}
alert_rule: null               # nothing to assess: the pass condition is that no alert is raised
injections:
  - {type: occlude_frames, tray_id: B, start: "2016-01-03T09:00:00Z", end: "2016-01-03T21:00:00Z"}
expected_top_cause: null
acceptable_causes: []
expected_alerts: []
scoring: {nominal: true}
