# Tray configuration (PLAN.md 0.3). One entry per tray; loaded by backend/config.py.
# Dataset: Aberystwyth Leaf Evaluation Dataset (ALED), frames span 2015-12-14 .. 2016-01-18.
trays:
  - id: A                              # tray id used everywhere in the API and DB
    crop: arabidopsis_thaliana         # crop species (model plant of space plant biology)
    hardware: "sensors: soil moisture and light on the tray; temperature, RH and CO2 from the shared room-air sensors"
    aled_tray: PSI_Tray031             # ALED source tray whose frames this tray replays
    treatment: control                 # control | no_water | low_light | humid_no_fan
    fault_start: null                  # ISO UTC when the simulated fault begins; null = no fault
    reference_tray_id: null            # tray compared against; null = none
    roi: [65, 15, 905, 740]            # x,y,w,h px in the 1024x768 frame: the PSI tray (20 pots), checked on tray A
    roi_margin_px: 40                  # canopy clip = ROI grown by this margin (leaves overhang the tray edge)
    pot_grid: {cols: 5, rows: 4}       # 5x4 pots: even split of the ROI; optional cells: {"r,c": [x,y,w,h]} overrides
    cm2_per_px: 0.01                   # nominal scale (no ArUco marker in ALED); placeholder
    calib_flag: nominal                # nominal = configured constant, not measured
    lamp: {"on": "08:00", "off": "22:00"}  # UTC; aligned to ALED imaging hours (frames 09:00-22:00)
    ppfd_est: 200                      # estimated PPFD, umol/m2/s
    soil: {dry_raw: 3000, wet_raw: 1400}  # soil probe raw values at dry / wet calibration (simulated)
    fault: {}                          # no fault parameters for the control tray

  - id: B
    crop: arabidopsis_thaliana
    hardware: "sensors: soil moisture and light on the tray; temperature, RH and CO2 from the shared room-air sensors"
    aled_tray: PSI_Tray032
    treatment: no_water                # water withheld -> wilting
    fault_start: "2016-01-05T08:00:00Z"   # bigger plants make wilting visible
    reference_tray_id: A               # compared against control tray A
    roi: [65, 15, 905, 740]            # same PSI scanner geometry as tray A
    pot_grid: {cols: 5, rows: 4}
    cm2_per_px: 0.01
    calib_flag: nominal
    lamp: {"on": "08:00", "off": "22:00"}  # UTC; aligned to ALED imaging hours
    ppfd_est: 200
    soil: {dry_raw: 3000, wet_raw: 1400}
    fault:
      shrink_per_day: 0.05             # each rosette shrinks toward its centroid: scale = max(s_min, 1 - 0.05*days)
      s_min: 0.55                      # smallest scale (reached after 9 days)
      desat_per_day: 0.08              # dulling toward grey-olive: t = min(1, 0.08*days)

  - id: C
    crop: arabidopsis_thaliana
    hardware: "sensors: soil moisture and light on the tray; temperature, RH and CO2 from the shared room-air sensors"
    aled_tray: PSI_Tray033
    treatment: low_light
    fault_start: "2016-01-03T08:00:00Z"   # after the 2016-01-01 imaging gap
    reference_tray_id: A
    roi: [65, 15, 905, 740]            # same PSI scanner geometry as tray A
    pot_grid: {cols: 5, rows: 4}
    cm2_per_px: 0.01
    calib_flag: nominal
    lamp: {"on": "08:00", "off": "22:00"}  # UTC; aligned to ALED imaging hours
    ppfd_est: 80                       # dimmed lamp after fault_start
    soil: {dry_raw: 3000, wet_raw: 1400}
    fault:
      growth_factor: 0.4               # time-warp: frame at fault_start + (t - fault_start) * 0.4
      brightness_factor: 0.6           # frame brightness scale (lamp dimming)

  - id: L
    crop: arabidopsis_thaliana
    hardware: "sensors: soil moisture and light on the tray; its own temperature and RH sensors at the canopy; CO2 from the shared room-air sensor"
    aled_tray: PSI_Tray034
    treatment: humid_no_fan            # humidity dome, no fan -> low VPD
    fault_start: "2016-01-08T08:00:00Z"
    reference_tray_id: A               # all four ALED trays are one Arabidopsis cohort, so L is compared with control A
    roi: [65, 15, 905, 740]            # same PSI scanner geometry as tray A
    pot_grid: {cols: 5, rows: 4}
    cm2_per_px: 0.01
    calib_flag: nominal
    lamp: {"on": "08:00", "off": "22:00"}  # UTC; aligned to ALED imaging hours
    ppfd_est: 200
    soil: {dry_raw: 3000, wet_raw: 1400}
    fault:
      rh_target_pct: 92                # simulated RH under the dome after fault_start
